<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23e8e4dc'/%3E%3C/svg%3E"/>
<title>Gaussian Engine</title>
<style>
:root{
  --bg:#0a0a0b;--panel:#141416;--line:rgba(255,255,255,.1);--fg:#f0f0f2;
  --muted:#9a9aa3;--accent:#e8e4dc;--accent-fg:#121214;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  --safe-l:env(safe-area-inset-left);--safe-r:env(safe-area-inset-right);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:13px/1.4 system-ui,-apple-system,sans-serif;position:fixed;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l))}
.top,.bottom{pointer-events:auto;max-width:min(980px,100%)}
.hud-min .top{max-width:min(520px,100%)}
.panel{background:rgba(20,20,22,.9);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(10px)}
h1{margin:0;font-size:14px;font-weight:600}
.muted{color:var(--muted);font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
button,label.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;
  padding:7px 10px;font:inherit;cursor:pointer;min-height:36px}
button:hover,label.btn:hover{border-color:rgba(255,255,255,.25)}
button.active{background:var(--accent);color:var(--accent-fg);border-color:transparent}
input[type=file]{display:none}
input[type=range]{width:110px;accent-color:var(--accent)}
#stats,#status{margin-top:4px;font-size:11px;color:var(--muted)}
#lan{margin-top:6px;color:var(--accent);font-size:12px;word-break:break-all}
#logWrap{display:none;margin-top:8px}
#logWrap.open{display:block}
#log{margin:0;max-height:28vh;overflow:auto;white-space:pre-wrap;font:11px/1.35 ui-monospace,Consolas,monospace;color:#c8c8d0}
#stick{position:fixed;left:calc(18px + var(--safe-l));bottom:calc(18px + var(--safe-b));pointer-events:auto;z-index:5}
#stickBase{width:112px;height:112px;border-radius:50%;background:rgba(20,20,22,.45);border:1px solid var(--line);
  position:relative;touch-action:none}
#stickKnob{width:44px;height:44px;border-radius:50%;background:rgba(232,228,220,.85);position:absolute;left:34px;top:34px}
.hud-min .row.scenes,.hud-min #hudExtra,.hud-min .hint{display:none}
.hint{opacity:.85}
@media (max-width:640px){
  h1{font-size:13px}
  button,label.btn{padding:6px 8px;min-height:34px;font-size:12px}
  input[type=range]{width:88px}
  .panel{padding:8px 10px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="top panel">
    <h1>Gaussian Engine</h1>
    <div class="muted">WebGL2 splat viewer · octree LoD · fixed draw budget</div>
    <div class="row scenes">
      <button id="btnRoom80k">Room 80k</button>
      <button id="btnRoom500k">Room 0.5M</button>
      <button id="btnRoom2m">Room 2M</button>
      <button id="btnRoom3m">Room 3.5M</button>
      <button id="btnOrbit" class="active">Orbit</button>
      <button id="btnWalk">Walk</button>
      <label class="btn">Load .splat<input id="fileSplat" type="file" accept=".splat,application/octet-stream"/></label>
      <button id="btnExport">Export</button>
    </div>
    <div class="row" id="hudExtra">
      <span class="muted">Budget</span>
      <input id="budget" type="range" min="4000" max="400000" step="2000" value="140000"/>
      <span id="budgetLabel" class="muted">140k</span>
      <span class="muted">Scale</span>
      <input id="scale" type="range" min="0.4" max="2.5" step="0.05" value="1"/>
      <span id="scaleLabel" class="muted">1.00</span>
      <span class="muted">LoD</span>
      <input id="lod" type="range" min="6" max="48" step="1" value="16"/>
      <span id="lodLabel" class="muted">16</span>
      <button id="btnLog">Log</button>
    </div>
    <div class="row">
      <div>
        <div id="status">Starting…</div>
        <div id="stats"></div>
        <div id="lan" hidden title="Click to copy"></div>
      </div>
      <button id="btnHud">Compact</button>
    </div>
    <div id="logWrap"><pre id="log"></pre></div>
  </div>
  <div class="bottom muted hint">Drag to look · pinch/scroll zoom · walk + joystick on phone · WASD desktop</div>
</div>
<div id="stick" hidden>
  <div id="stickBase"><div id="stickKnob"></div></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
